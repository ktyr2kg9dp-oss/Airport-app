# Render Blueprint — deploys Expense Manager as a free web app.
# In Render: New + → Blueprint → pick this repo → Apply. You'll get a public
# URL you can open from any device (data is stored locally in each browser).
services:
  - type: web
    name: expense-manager
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
