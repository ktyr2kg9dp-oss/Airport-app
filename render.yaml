# Render Blueprint — deploys Cup-Les as a free always-on web app.
# In Render: New + → Blueprint → pick this repo → Apply. You'll get a public
# URL both partners can open from their phones (share the same pair code).
services:
  - type: web
    name: cup-les
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
