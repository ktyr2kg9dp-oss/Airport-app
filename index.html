<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Expense Manager 💳</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%B3%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <header class="brand">
      <h1>Expense Manager <span class="brand-emoji">💳</span></h1>
      <p class="tagline">Log every payment you make on your trip.</p>
    </header>

    <!-- ============ New payment form ============ -->
    <form id="expense-form" class="card" autocomplete="off" novalidate>
      <h2 class="card-title">New payment</h2>

      <!-- Date -->
      <label class="field" for="date">
        <span class="field-label">Date</span>
        <input type="date" id="date" name="date" required />
      </label>

      <!-- Hour -->
      <div class="field">
        <span class="field-label">Hour</span>
        <div class="time-row">
          <input type="time" id="time" name="time" />
          <button type="button" id="time-na" class="chip" aria-pressed="false">
            Not relevant
          </button>
        </div>
      </div>

      <!-- Payment method -->
      <div class="field">
        <span class="field-label">Payment method</span>
        <div class="segmented" role="group" aria-label="Payment method">
          <button type="button" class="seg" data-method="cash">💵 Cash</button>
          <button type="button" class="seg" data-method="card">💳 Card</button>
          <button type="button" class="seg" data-method="transfer">🏦 Bank transfer</button>
        </div>
      </div>

      <!-- Method details: revealed once a method is chosen -->
      <div id="method-details" class="method-details" hidden>
        <!-- Amount + currency -->
        <div class="field">
          <span class="field-label">Amount</span>
          <div class="amount-row">
            <input type="text" id="amount" name="amount" inputmode="decimal"
                   placeholder="0.00" autocomplete="off" />
            <div class="currency-toggle" role="group" aria-label="Currency">
              <button type="button" class="cur" data-currency="USD" aria-pressed="true">$ USD</button>
              <button type="button" class="cur" data-currency="ILS" aria-pressed="false">₪ NIS</button>
            </div>
          </div>
        </div>

        <!-- Card endings: only when "Card" is selected -->
        <div id="card-picker" class="field" hidden>
          <span class="field-label">Which card?</span>
          <div class="card-endings" role="group" aria-label="Card ending">
            <button type="button" class="card-btn" data-card="4255">•••• 4255</button>
            <button type="button" class="card-btn" data-card="6694">•••• 6694</button>
            <button type="button" class="card-btn" data-card="1921">•••• 1921</button>
          </div>
        </div>
      </div>

      <p id="form-error" class="form-error" hidden></p>

      <div class="form-actions">
        <button type="submit" class="btn primary">Add payment</button>
        <button type="button" id="reset-btn" class="btn ghost">Reset</button>
      </div>
    </form>

    <!-- ============ Saved payments ============ -->
    <section class="card">
      <div class="list-head">
        <h2 class="card-title">Payments</h2>
        <span class="count" id="count">0</span>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty">No payments yet — add your first one above.</p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
