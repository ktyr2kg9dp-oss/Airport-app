<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c2185b" />
  <title>Cup-Les 💑</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%91%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">

    <!-- ============ Screen 1: choose who you are ============ -->
    <section id="screen-setup" class="screen active">
      <header class="brand">
        <h1>Cup&#8209;Les <span class="hearts">💑</span></h1>
        <p class="tagline">A tiny app just for the two of you.</p>
      </header>

      <div class="card setup-card">
        <label class="field">
          <span class="field-label">Your pair code</span>
          <input id="pair-code" type="text" inputmode="latin" autocomplete="off"
                 placeholder="e.g. lovebirds" maxlength="40" />
          <small class="hint">Both of you type the <em>same</em> code so your apps connect.</small>
        </label>

        <p class="who-label">Who are you?</p>
        <div class="role-choice">
          <button class="role-btn" data-role="husband">
            <span class="role-emoji">🤵</span>
            <span class="role-name">Husband</span>
          </button>
          <button class="role-btn" data-role="wife">
            <span class="role-emoji">👰</span>
            <span class="role-name">Wife</span>
          </button>
        </div>
        <p id="setup-error" class="setup-error" hidden></p>
      </div>
    </section>

    <!-- ============ Screen 2: the wife's app ============ -->
    <section id="screen-wife" class="screen">
      <header class="topbar">
        <button class="link-btn" data-back>‹ Change</button>
        <div class="status"><span class="dot" id="dot-wife"></span><span id="presence-wife">Connecting…</span></div>
      </header>
      <div class="stage">
        <p class="stage-hint">Send some love to your husband.</p>
        <button id="btn-bow" class="mega-btn bow" data-send="bow">
          <span class="mega-emoji">🙇‍♀️</span>
          <span class="mega-label">BOW</span>
        </button>
        <div class="sent-toast" id="toast-wife" hidden></div>
      </div>
      <div class="feed-wrap">
        <h2 class="feed-title">Messages</h2>
        <ul id="feed-wife" class="feed"></ul>
      </div>
    </section>

    <!-- ============ Screen 3: the husband's app ============ -->
    <section id="screen-husband" class="screen">
      <header class="topbar">
        <button class="link-btn" data-back>‹ Change</button>
        <div class="status"><span class="dot" id="dot-husband"></span><span id="presence-husband">Connecting…</span></div>
      </header>
      <div class="stage">
        <p class="stage-hint">Let her know how you feel.</p>
        <div class="btn-grid">
          <button class="action-btn mad" data-send="mad">
            <span class="action-emoji">😠</span>
            <span class="action-label">MAD</span>
          </button>
          <button class="action-btn bad" data-send="bad">
            <span class="action-emoji">🙁</span>
            <span class="action-label">BAD</span>
          </button>
          <button class="action-btn cucumber" data-send="cucumber" aria-label="Intimacy">
            <svg class="cucumber-icon" viewBox="0 0 64 64" aria-hidden="true">
              <path d="M46 12c1.6-2.4 4.2-4 6.6-3.4 2.2.6 3 3 2.2 5-.7 1.8-2.3 3-3.9 3.7"
                    fill="none" stroke="currentColor" stroke-width="3.2"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M48 16c6 6 8 15 4.5 24C48 51 37 57 26 55 16 53.2 8.5 45 9 34.5 9.4 25 16 17.5 25 16c6-1 10 .2 14 .8 3 .5 6 .2 9-.8z"
                    fill="none" stroke="currentColor" stroke-width="3.2"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="24" cy="30" r="1.6" fill="currentColor"/>
              <circle cx="33" cy="38" r="1.6" fill="currentColor"/>
              <circle cx="20" cy="40" r="1.6" fill="currentColor"/>
              <circle cx="30" cy="27" r="1.6" fill="currentColor"/>
              <circle cx="38" cy="45" r="1.6" fill="currentColor"/>
            </svg>
            <span class="action-label">Want you</span>
          </button>
        </div>
        <div class="sent-toast" id="toast-husband" hidden></div>
      </div>
      <div class="feed-wrap">
        <h2 class="feed-title">Messages</h2>
        <ul id="feed-husband" class="feed"></ul>
      </div>
    </section>

  </div>

  <!-- Incoming-message banner (shared by both roles) -->
  <div id="banner" class="banner" hidden>
    <div class="banner-inner">
      <span id="banner-title" class="banner-title"></span>
      <span id="banner-text" class="banner-text"></span>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
