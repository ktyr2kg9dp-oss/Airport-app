<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Expense Manager 💳</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%B3%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <header class="brand">
      <h1>Expense Manager <span class="brand-emoji">💳</span></h1>
      <p class="tagline">Log every payment you make on your trip.</p>
    </header>

    <!-- ============ Trips library ============ -->
    <section class="card">
      <div class="list-head">
        <h2 class="card-title">Trips</h2>
        <button type="button" id="new-trip-btn" class="chip">+ New trip</button>
      </div>
      <div id="new-trip-row" class="new-trip-row" hidden>
        <input type="text" id="new-trip-name" maxlength="60"
               placeholder="Trip name — e.g. Grand Canyon trip" autocomplete="off" />
        <button type="button" id="create-trip-btn" class="btn primary btn-sm">Create</button>
      </div>
      <div id="trips" class="trips"></div>
      <p id="trips-empty" class="empty">No trips yet — create your first trip to start adding payments.</p>
    </section>

    <!-- ============ New / edit payment form ============ -->
    <form id="expense-form" class="card" autocomplete="off" novalidate hidden>
      <h2 class="card-title" id="form-title">New payment</h2>

      <!-- Date -->
      <label class="field" for="date">
        <span class="field-label">Date</span>
        <input type="date" id="date" name="date" required />
      </label>

      <!-- Hour -->
      <div class="field">
        <span class="field-label">Hour</span>
        <div class="time-row">
          <input type="time" id="time" name="time" />
          <button type="button" id="time-na" class="chip" aria-pressed="false">
            Not relevant
          </button>
        </div>
      </div>

      <!-- Amount + currency (built-in number pad, shown for every method) -->
      <div class="field">
        <span class="field-label">Amount</span>
        <div class="amount-row">
          <input type="text" id="amount" name="amount" inputmode="none" readonly
                 placeholder="0.00" autocomplete="off" aria-label="Payment amount" />
          <div class="currency-toggle" role="group" aria-label="Currency">
            <button type="button" class="cur" data-currency="USD" aria-pressed="true">$ USD</button>
            <button type="button" class="cur" data-currency="ILS" aria-pressed="false">₪ NIS</button>
          </div>
        </div>
        <div id="keypad" class="keypad" hidden>
          <button type="button" class="key" data-key="7">7</button>
          <button type="button" class="key" data-key="8">8</button>
          <button type="button" class="key" data-key="9">9</button>
          <button type="button" class="key" data-key="4">4</button>
          <button type="button" class="key" data-key="5">5</button>
          <button type="button" class="key" data-key="6">6</button>
          <button type="button" class="key" data-key="1">1</button>
          <button type="button" class="key" data-key="2">2</button>
          <button type="button" class="key" data-key="3">3</button>
          <button type="button" class="key" data-key=".">.</button>
          <button type="button" class="key" data-key="0">0</button>
          <button type="button" class="key key-back" data-key="back" aria-label="Delete">⌫</button>
          <button type="button" class="key key-done" data-key="done">Done</button>
        </div>
      </div>

      <!-- Type of expense -->
      <div class="field">
        <span class="field-label">Type of expense</span>
        <div class="categories" role="group" aria-label="Type of expense">
          <button type="button" class="cat" data-cat="food">🍽️ Food</button>
          <button type="button" class="cat" data-cat="taxi">🚕 Uber / taxi</button>
          <button type="button" class="cat" data-cat="hotel">🏨 Hotel</button>
          <button type="button" class="cat" data-cat="carrent">🚗 Car rent</button>
          <button type="button" class="cat cat-other" data-cat="other">⋯ Other</button>
        </div>
        <div id="other-types" class="sub-cats" hidden>
          <button type="button" class="subcat" data-sub="train">🚆 Train</button>
        </div>
      </div>

      <!-- Payment method -->
      <div class="field">
        <span class="field-label">Payment method</span>
        <div class="segmented" role="group" aria-label="Payment method">
          <button type="button" class="seg" data-method="cash">💵 Cash</button>
          <button type="button" class="seg" data-method="card">💳 Card</button>
          <button type="button" class="seg" data-method="transfer">🏦 Bank transfer</button>
        </div>
      </div>

      <!-- Card endings: only when "Card" is selected -->
      <div id="card-picker" class="field" hidden>
        <span class="field-label">Which card?</span>
        <div class="card-endings" role="group" aria-label="Card ending">
          <button type="button" class="card-btn" data-card="4255">•••• 4255</button>
          <button type="button" class="card-btn" data-card="6694">•••• 6694</button>
          <button type="button" class="card-btn" data-card="1921">•••• 1921</button>
        </div>
      </div>

      <!-- Receipt photo -->
      <div class="field">
        <span class="field-label">Receipt</span>
        <label class="photo-btn">
          <span>📷 Take / choose photo</span>
          <input type="file" id="photo-input" accept="image/*" capture="environment" hidden />
        </label>
        <div id="photo-preview" class="photo-preview" hidden>
          <img id="photo-img" alt="Receipt photo" />
          <button type="button" id="photo-remove" class="chip">Remove photo</button>
        </div>
      </div>

      <p id="form-error" class="form-error" hidden></p>

      <div class="form-actions">
        <button type="submit" class="btn primary" id="submit-btn">Add payment</button>
        <button type="button" id="cancel-btn" class="btn ghost" hidden>Cancel</button>
        <button type="button" id="reset-btn" class="btn ghost">Reset</button>
      </div>
    </form>

    <!-- ============ Saved payments ============ -->
    <section class="card" id="payments-card" hidden>
      <div class="list-head">
        <h2 class="card-title" id="payments-title">Payments</h2>
        <div class="head-actions">
          <button type="button" id="export-btn" class="chip" hidden>⬇︎ Export</button>
          <span class="count" id="count">0</span>
        </div>
      </div>
      <div class="total-row" id="total-row" hidden>
        <span>Total</span>
        <span id="total" class="total"></span>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty">No payments yet — add your first one above.</p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
